      <text x="1200" y="98" fill="#64748B" text-anchor="end">21 CRITICAL · 60 HIGH · 13 MEDIUM</text>
    </g>

    <!-- title block -->
    <text x="76" y="212" font-size="86" font-weight="700" letter-spacing="-1.5" fill="#F8FAFC">Ashford Grove Capital</text>
    <text x="80" y="266" font-size="33" font-weight="600" fill="#99F6E4">SOC L1 Detection &amp; Investigation Portfolio</text>
    <text x="80" y="314" font-size="24" fill="#94A3B8">One breach · one hundred cases · every verdict evidenced</text>

    <!-- stat strip -->
