<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Ashford Grove Capital — SOC L1 Detection &amp; Investigation Portfolio</title>
  <desc id="desc">One breach · one hundred cases · every verdict evidenced. 100 of 100 scenarios documented, 85 ATT&amp;CK technique–tactic pairs, 12 of 12 tactics evidenced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0D192B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.34"/>
      <stop offset="0.6" stop-color="#0F766E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C30"/>
      <stop offset="1" stop-color="#0C1626"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#1E293B"/>
    </pattern>
  </defs>

  <g font-family="Segoe UI, Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
