    <rect width="1280" height="640" fill="url(#grid)"/>
    <rect width="760" height="640" fill="url(#glow)"/>
    <rect width="8" height="640" fill="#14B8A6"/>

    <!-- header tags -->
    <g font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="15" letter-spacing="3">
