      <circle cx="560" cy="592" r="8" fill="#0B1220" stroke="#2DD4BF" stroke-width="2"/>
      <text x="560" y="616" font-size="12" fill="#94A3B8" text-anchor="middle">LAN-NET</text>
      <text x="560" y="631" font-size="11" fill="#475569" text-anchor="middle">10.10.10.0/24</text>

      <circle cx="800" cy="592" r="8" fill="#0B1220" stroke="#F59E0B" stroke-width="2"/>
      <text x="800" y="616" font-size="12" fill="#94A3B8" text-anchor="middle">DMZ-NET</text>
      <text x="800" y="631" font-size="11" fill="#475569" text-anchor="middle">10.10.20.0/24</text>

      <circle cx="1040" cy="592" r="8" fill="#0F766E" stroke="#2DD4BF" stroke-width="2"/>
      <text x="1040" y="616" font-size="12" fill="#94A3B8" text-anchor="middle">SOC-NET</text>
      <text x="1040" y="631" font-size="11" fill="#475569" text-anchor="middle">10.10.30.0/24</text>
