      <text x="120" y="631" font-size="11" fill="#475569" text-anchor="middle">10.10.40.0/24</text>

      <rect x="292" y="583" width="18" height="18" rx="3" fill="#0F766E" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="301" y="616" font-size="12" fill="#94A3B8" text-anchor="middle">OPNsense-FW</text>
