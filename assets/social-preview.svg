    <text x="106" y="386" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" letter-spacing="3" fill="#64748B">COVERAGE</text>
    <line x1="453" y1="400" x2="453" y2="524" stroke="#1E293B" stroke-width="1.5"/>
    <line x1="827" y1="400" x2="827" y2="524" stroke="#1E293B" stroke-width="1.5"/>

    <g text-anchor="middle">
      <text x="266" y="458" font-size="62" font-weight="700" letter-spacing="-2" fill="#2DD4BF">100/100</text>
      <text x="266" y="492" font-size="15" letter-spacing="2.2" fill="#94A3B8">SCENARIOS</text>
      <text x="266" y="514" font-size="15" letter-spacing="2.2" fill="#94A3B8">DOCUMENTED</text>
      <rect x="196" y="528" width="140" height="5" rx="2.5" fill="#0F766E"/>

      <text x="640" y="458" font-size="62" font-weight="700" letter-spacing="-2" fill="#2DD4BF">85</text>
      <text x="640" y="492" font-size="15" letter-spacing="2.2" fill="#94A3B8">ATT&amp;CK TECHNIQUE–</text>
      <text x="640" y="514" font-size="15" letter-spacing="2.2" fill="#94A3B8">TACTIC PAIRS</text>
      <text x="640" y="536" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" fill="#475569">78 distinct techniques</text>

      <text x="1013" y="458" font-size="62" font-weight="700" letter-spacing="-2" fill="#2DD4BF">12/12</text>
      <text x="1013" y="492" font-size="15" letter-spacing="2.2" fill="#94A3B8">TACTICS</text>
      <text x="1013" y="514" font-size="15" letter-spacing="2.2" fill="#94A3B8">EVIDENCED</text>
      <rect x="943" y="528" width="140" height="5" rx="2.5" fill="#0F766E"/>
