    <text x="1200" y="386" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="13" letter-spacing="1.5" fill="#475569" text-anchor="end">100% open-source · wazuh · security onion · sysmon · opnsense</text>
