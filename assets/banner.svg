<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ashford Grove Capital — SOC L1 Detection &amp; Investigation Portfolio</title>
  <desc id="desc">One breach · one hundred cases · every verdict evidenced. 100 of 100 scenarios documented, 85 ATT&amp;CK technique–tactic pairs, 12 of 12 tactics evidenced.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0D192B"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0F766E" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101C30"/>
      <stop offset="1" stop-color="#0C1626"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#1E293B"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)" font-family="Segoe UI, Inter, -apple-system, 'Helvetica Neue', Arial, sans-serif">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="560" height="300" fill="url(#glow)"/>
    <rect width="6" height="300" fill="#14B8A6"/>
    <rect y="0" width="1200" height="1" fill="#1E293B"/>
    <rect y="299" width="1200" height="1" fill="#1E293B"/>

    <!-- header tag -->
    <text x="40" y="52" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="12" letter-spacing="2.4" fill="#5EEAD4" fill-opacity="0.85">ASHFORD-GROVE-SOC  ·  L1 DETECTION &amp; INVESTIGATION  ·  MITRE ATT&amp;CK v16</text>

    <!-- title block -->
    <text x="38" y="121" font-size="54" font-weight="700" letter-spacing="-0.6" fill="#F8FAFC">Ashford Grove Capital</text>
    <text x="40" y="157" font-size="21" font-weight="600" fill="#99F6E4">SOC L1 Detection &amp; Investigation Portfolio</text>
    <text x="40" y="190" font-size="16" fill="#94A3B8">One breach · one hundred cases · every verdict evidenced</text>

    <!-- four-zone motif -->
    <g font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace">
      <line x1="72" y1="252" x2="188" y2="252" stroke="#F87171" stroke-opacity="0.75" stroke-width="1.2" stroke-dasharray="3 3"/>
      <line x1="202" y1="252" x2="620" y2="252" stroke="#334155" stroke-width="1.2"/>
      <text x="130" y="241" font-size="9" letter-spacing="1" fill="#FCA5A5" fill-opacity="0.9" text-anchor="middle">1 LOGGED RULE</text>

      <circle cx="64" cy="252" r="6" fill="#0B1220" stroke="#F87171" stroke-width="1.5"/>
      <text x="64" y="272" font-size="10" fill="#94A3B8" text-anchor="middle">EXT-SIM-NET</text>
      <text x="64" y="284" font-size="9" fill="#475569" text-anchor="middle">10.10.40.0/24</text>

      <rect x="188" y="245" width="14" height="14" rx="2" fill="#0F766E" stroke="#2DD4BF" stroke-width="1.2"/>
      <text x="195" y="272" font-size="10" fill="#94A3B8" text-anchor="middle">OPNsense-FW</text>
      <text x="195" y="284" font-size="9" fill="#475569" text-anchor="middle">default-deny</text>

      <circle cx="340" cy="252" r="6" fill="#0B1220" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="340" y="272" font-size="10" fill="#94A3B8" text-anchor="middle">LAN-NET</text>
      <text x="340" y="284" font-size="9" fill="#475569" text-anchor="middle">10.10.10.0/24</text>

      <circle cx="475" cy="252" r="6" fill="#0B1220" stroke="#F59E0B" stroke-width="1.5"/>
      <text x="475" y="272" font-size="10" fill="#94A3B8" text-anchor="middle">DMZ-NET</text>
      <text x="475" y="284" font-size="9" fill="#475569" text-anchor="middle">10.10.20.0/24</text>

      <circle cx="610" cy="252" r="6" fill="#0F766E" stroke="#2DD4BF" stroke-width="1.5"/>
      <text x="610" y="272" font-size="10" fill="#94A3B8" text-anchor="middle">SOC-NET</text>
      <text x="610" y="284" font-size="9" fill="#475569" text-anchor="middle">10.10.30.0/24</text>
    </g>

    <!-- stat strip -->
    <rect x="722" y="46" width="438" height="178" rx="12" fill="url(#panel)" stroke="#1E293B"/>
    <text x="744" y="72" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="10" letter-spacing="2.2" fill="#64748B">COVERAGE</text>
    <line x1="868" y1="86" x2="868" y2="200" stroke="#1E293B"/>
    <line x1="1014" y1="86" x2="1014" y2="200" stroke="#1E293B"/>

    <g text-anchor="middle">
      <text x="795" y="139" font-size="38" font-weight="700" letter-spacing="-1" fill="#2DD4BF">100/100</text>
      <text x="795" y="164" font-size="10.5" letter-spacing="1.4" fill="#94A3B8">SCENARIOS</text>
      <text x="795" y="179" font-size="10.5" letter-spacing="1.4" fill="#94A3B8">DOCUMENTED</text>
      <rect x="745" y="194" width="100" height="4" rx="2" fill="#1E293B"/>
      <rect x="745" y="194" width="100" height="4" rx="2" fill="#0F766E"/>

      <text x="941" y="139" font-size="38" font-weight="700" letter-spacing="-1" fill="#2DD4BF">85</text>
      <text x="941" y="164" font-size="10.5" letter-spacing="1.4" fill="#94A3B8">ATT&amp;CK TECHNIQUE–</text>
      <text x="941" y="179" font-size="10.5" letter-spacing="1.4" fill="#94A3B8">TACTIC PAIRS</text>
      <text x="941" y="200" font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="9.5" fill="#475569">78 distinct techniques</text>

      <text x="1087" y="139" font-size="38" font-weight="700" letter-spacing="-1" fill="#2DD4BF">12/12</text>
      <text x="1087" y="164" font-size="10.5" letter-spacing="1.4" fill="#94A3B8">TACTICS</text>
      <text x="1087" y="179" font-size="10.5" letter-spacing="1.4" fill="#94A3B8">EVIDENCED</text>
      <rect x="1037" y="194" width="100" height="4" rx="2" fill="#1E293B"/>
      <rect x="1037" y="194" width="100" height="4" rx="2" fill="#0F766E"/>
    </g>

    <!-- footer captions under the strip -->
    <g font-family="'Cascadia Code', Consolas, 'JetBrains Mono', Menlo, monospace" font-size="11" fill="#64748B">
      <text x="724" y="252">verdicts  21 critical · 60 high · 13 medium  ·  20 judgment-track cases</text>
      <text x="724" y="272" fill="#475569">wazuh · security onion · sysmon · opnsense  ·  100% open-source stack</text>
    </g>
  </g>
</svg>
